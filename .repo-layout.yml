{
  "version": 1,
  "comment": "Repo layout contract, enforced by tools/check_repo_layout.py. JSON syntax: valid YAML too, parses with the Python standard library. required: paths that must exist (trailing slash = directory). root: files at the repository root must match allow and never match deny. directories: every tracked top-level directory must be listed; files under it (any depth) must match one allow pattern (matched against the basename).",
  "required": [
    "README.md",
    "LICENSE",
    "CONTRIBUTING.md",
    "SECURITY.md",
    ".github/CODEOWNERS"
  ],
  "root": {
    "allow": [
      "*.json",
      "*.md",
      "*.mjs",
      "*.yml",
      ".gitignore",
      "LICENSE",
      "deps-inventory.json"
    ],
    "deny": [
      "*.py"
    ]
  },
  "directories": {
    ".github": {
      "allow": [
        "*.yml",
        "CODEOWNERS"
      ]
    },
    ".well-known": {
      "allow": [
        "*.txt"
      ]
    },
    "assets": {
      "allow": [
        "*.css",
        "*.jpg",
        "*.js",
        "*.png"
      ]
    },
    "content": {
      "allow": [
        "*.json"
      ]
    },
    "docs": {
      "allow": [
        "*.jpg",
        "*.md",
        "*.pdf"
      ]
    },
    "scripts": {
      "allow": [
        "*.mjs"
      ]
    },
    "src": {
      "allow": [
        "*.mjs"
      ]
    },
    "tests": {
      "allow": [
        "*.mjs"
      ]
    },
    "tools": {
      "allow": [
        "*.py"
      ]
    }
  }
}
